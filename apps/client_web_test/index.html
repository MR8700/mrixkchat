<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MRixk - Testeur Multiplateforme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-warm": "#F7F8F5",
            "card-bg": "#FFFFFF",
            "primary": "#0043b8",
            "primary-container": "#245bdb",
            "primary-soft": "#edf2ff",
            "secondary": "#006b5f",
            "secondary-glow": "#20b8a5",
            "secondary-light": "#e6f8f5",
            "on-surface": "#111c2c",
            "on-surface-variant": "#5a6275",
            "border-subtle": "rgba(223, 228, 237, 0.85)"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Manrope", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- TOP RUNNER BAR (HIDDEN IN STANDALONE APP MODE) -->
  <header id="top-bar" class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white text-base shadow-md">
        ◈
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-display font-bold text-sm text-white">MRixk Émulateur</span>
          <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-semibold border border-emerald-500/30 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            CRUD Base Locale Active
          </span>
        </div>
      </div>
    </div>

    <!-- DEVICE SWITCHER BUTTONS -->
    <div class="flex items-center gap-1.5 bg-slate-950/60 p-1 rounded-2xl border border-slate-700">
      <button id="btn-mode-android" onclick="setMode('android')" class="px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all bg-blue-600 text-white shadow">
        <span class="material-symbols-outlined text-[16px]">phone_android</span>
        <span>Android (Mobile)</span>
      </button>
      <button id="btn-mode-linux" onclick="setMode('linux')" class="px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all text-slate-400 hover:text-white">
        <span class="material-symbols-outlined text-[16px]">desktop_windows</span>
        <span>Linux / Desktop (3 Volets)</span>
      </button>
    </div>

    <!-- RESET ACTION -->
    <button onclick="resetDatabase()" class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs flex items-center gap-1.5 transition">
      <span class="material-symbols-outlined text-[15px]">refresh</span>
      <span>Réinitialiser CRUD</span>
    </button>
  </header>

  <!-- VIEWPORT FRAME -->
  <main class="flex-1 flex items-center justify-center p-2 sm:p-4 overflow-auto">
    <div id="emulator-frame" class="w-[390px] h-[844px] bg-[#F7F8F5] rounded-[44px] shadow-2xl border-[8px] border-slate-800 flex flex-col overflow-hidden relative transition-all duration-300">
      
      <!-- PHONE NOTCH (MOBILE ONLY) -->
      <div id="phone-notch" class="h-6 w-full bg-[#F7F8F5] flex items-center justify-between px-6 pt-1 text-[11px] font-bold text-slate-800 z-50 shrink-0">
        <span>10:42</span>
        <div class="w-20 h-4 bg-slate-900 rounded-full"></div>
        <div class="flex items-center gap-1">
          <span class="material-symbols-outlined text-[13px]">signal_cellular_4_bar</span>
          <span class="material-symbols-outlined text-[13px]">wifi</span>
          <span class="material-symbols-outlined text-[13px]">battery_full</span>
        </div>
      </div>

      <!-- MAIN APP CONTAINER -->
      <div id="app-content" class="flex-1 flex flex-col overflow-hidden relative text-slate-800">
      </div>

      <!-- FLOATING BOTTOM NAV (MOBILE VIEW) -->
      <div id="mobile-nav-bar" class="absolute bottom-3 inset-x-4 z-40">
        <nav class="bg-white/95 backdrop-blur-xl rounded-full px-2 py-1.5 shadow-[0_10px_30px_rgba(17,28,44,0.12)] border border-[rgba(223,228,237,0.85)] flex justify-around items-center">
          <button onclick="switchTab('discussions')" id="tab-btn-discussions" class="flex flex-col items-center justify-center py-1 px-2 text-blue-700 font-bold">
            <div class="relative flex items-center justify-center w-10 h-7 rounded-full bg-blue-50 text-blue-700">
              <span class="material-symbols-outlined text-[20px]">chat_bubble</span>
              <span class="absolute -top-1 -right-1 bg-blue-700 text-white text-[9px] font-bold px-1.5 rounded-full">2</span>
            </div>
            <span class="text-[10px] font-bold mt-0.5">Discussions</span>
          </button>
          <button onclick="switchTab('moments')" id="tab-btn-moments" class="flex flex-col items-center justify-center py-1 px-2 text-slate-500 hover:text-slate-800">
            <span class="material-symbols-outlined text-[20px]">slow_motion_video</span>
            <span class="text-[10px] font-medium mt-0.5">Moments</span>
          </button>
          <button onclick="switchTab('contacts')" id="tab-btn-contacts" class="flex flex-col items-center justify-center py-1 px-2 text-slate-500 hover:text-slate-800">
            <span class="material-symbols-outlined text-[20px]">contacts</span>
            <span class="text-[10px] font-medium mt-0.5">Contacts</span>
          </button>
          <button onclick="switchTab('assistant')" id="tab-btn-assistant" class="flex flex-col items-center justify-center py-1 px-2 text-slate-500 hover:text-slate-800 relative">
            <div class="relative">
              <span class="material-symbols-outlined text-[20px]">auto_awesome</span>
              <span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-teal-400 ring-2 ring-white"></span>
            </div>
            <span class="text-[10px] font-medium mt-0.5">Assistant</span>
          </button>
          <button onclick="switchTab('profil')" id="tab-btn-profil" class="flex flex-col items-center justify-center py-1 px-2 text-slate-500 hover:text-slate-800">
            <span class="material-symbols-outlined text-[20px]">account_circle</span>
            <span class="text-[10px] font-medium mt-0.5">Profil</span>
          </button>
        </nav>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

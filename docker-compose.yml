version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrixk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrixk
      POSTGRES_USER: mrixk_admin
      POSTGRES_PASSWORD: mrixk_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrixk_admin -d mrixk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mrixk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mrixk-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mrixk_storage_admin
      MINIO_ROOT_PASSWORD: mrixk_storage_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: mrixk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://mrixk_admin:mrixk_secure_password_2026@postgres:5432/mrixk?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: mrixk_storage_admin
      STORAGE_SECRET_KEY: mrixk_storage_secret_key_2026
      STORAGE_BUCKET: mrixk-media
      JWT_SIGNING_KEY: mrixk_jwt_ephemeral_dev_secret_key_should_be_rotated_2026
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:

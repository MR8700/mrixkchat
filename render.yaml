services:
  - type: web
    name: mrixk-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mrixk-db
          property: connectionString
      - key: MAX_DEVICES_PER_USER
        value: "3"
      - key: JWT_SIGNING_KEY
        generateValue: true

databases:
  - name: mrixk-db
    plan: free
    region: frankfurt
    databaseName: mrixk
    user: mrixk_admin
